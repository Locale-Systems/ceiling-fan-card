<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ceiling Fan Card — Dev</title>
    <style>
      :root {
        --primary-color: #03a9f4;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --text-primary-color: #fff;
        --card-background-color: #fff;
        --secondary-background-color: #e5e5e5;
        --divider-color: rgba(0, 0, 0, 0.12);
        --disabled-color: #bdbdbd;
        --state-icon-color: #44739e;
        --warning-color: #ffa600;
        --page-bg: #fafafa;
      }
      :root[data-theme="dark"] {
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --card-background-color: #1c1c1c;
        --secondary-background-color: #282828;
        --divider-color: rgba(225, 225, 225, 0.12);
        --disabled-color: #6f6f6f;
        --state-icon-color: #9e9e9e;
        --page-bg: #111;
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: Roboto, system-ui, sans-serif;
        background: var(--page-bg);
        color: var(--primary-text-color);
      }
      .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr));
        gap: 16px;
        align-items: start;
      }
      .grid h3 { margin: 0 0 8px; font-size: 13px; font-weight: 500; color: var(--secondary-text-color); }
      pre#log {
        margin-top: 16px; padding: 12px; max-height: 200px; overflow: auto;
        background: var(--secondary-background-color); border-radius: 8px; font-size: 12px;
        white-space: pre-wrap; word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <strong>Ceiling Fan Card</strong>
      <button id="theme">Toggle dark</button>
    </div>
    <div class="grid" id="grid"></div>
    <pre id="log"></pre>

    <script type="module">
      import { createMockHass } from "./mock-hass.js";
      import "../dist/ceiling-fan-card.js";

      const STEP3 = 100 / 3;
      const FAN_FULL = 1 | 4 | 16 | 32; // speed, direction, on, off

      const initialStates = {
        "fan.living_room": {
          entity_id: "fan.living_room", state: "on",
          attributes: { friendly_name: "Living Room Fan", percentage: STEP3 * 2, percentage_step: STEP3,
            direction: "forward", supported_features: FAN_FULL },
        },
        "fan.bedroom": {
          entity_id: "fan.bedroom", state: "off",
          attributes: { friendly_name: "Bedroom Fan", percentage: 0, percentage_step: 100 / 6,
            direction: "reverse", supported_features: FAN_FULL },
        },
        "fan.patio": {
          entity_id: "fan.patio", state: "on",
          attributes: { friendly_name: "Patio Fan", percentage: 45, percentage_step: 1,
            supported_features: 1 | 16 | 32 },
        },
        "fan.office": {
          entity_id: "fan.office", state: "on",
          attributes: { friendly_name: "Office Fan", percentage: STEP3, percentage_step: STEP3,
            direction: "forward", oscillating: true, supported_features: FAN_FULL | 2 },
        },
        "fan.tower": {
          entity_id: "fan.tower", state: "off",
          attributes: { friendly_name: "Tower Fan", percentage: 0, percentage_step: 25,
            oscillating: false, supported_features: 1 | 2 | 16 | 32 },
        },
        "fan.garage": { entity_id: "fan.garage", state: "unavailable", attributes: { friendly_name: "Garage Fan" } },
        "light.living_room_down": {
          entity_id: "light.living_room_down", state: "on",
          attributes: { friendly_name: "Living Room Downlight", brightness: 180, supported_color_modes: ["brightness"] },
        },
        "light.living_room_up": {
          entity_id: "light.living_room_up", state: "off",
          attributes: { friendly_name: "Living Room Uplight", supported_color_modes: ["onoff"] },
        },
        "light.bedroom": {
          entity_id: "light.bedroom", state: "off",
          attributes: { friendly_name: "Bedroom Fan Light", supported_color_modes: ["color_temp", "hs"] },
        },
      };

      const configs = [
        ["3-speed, direction, dimmable + on/off light", {
          fan: "fan.living_room", name: "Living Room",
          lights: [{ entity: "light.living_room_down", name: "Downlight" }, { entity: "light.living_room_up", name: "Uplight" }],
        }],
        ["6-speed, off, one light", { fan: "fan.bedroom", lights: [{ entity: "light.bedroom" }] }],
        ["Continuous %, no direction, slider_turns_on: false", { fan: "fan.patio", slider_turns_on: false }],
        ["3-speed, direction + oscillation (oscillating)", { fan: "fan.office" }],
        ["4-speed, oscillation only (off)", { fan: "fan.tower", icon: "mdi:fan" }],
        ["Oscillation supported but show_oscillation: false", { fan: "fan.office", name: "Office (hidden)", show_oscillation: false }],
        ["Unavailable fan + missing light", { fan: "fan.garage", lights: [{ entity: "light.nope" }] }],
      ];

      const logEl = document.getElementById("log");
      const log = (msg) => (logEl.textContent = `${new Date().toLocaleTimeString()}  ${msg}\n` + logEl.textContent);

      const grid = document.getElementById("grid");
      const cards = configs.map(([title, config]) => {
        const wrap = document.createElement("div");
        wrap.innerHTML = `<h3>${title}</h3>`;
        const card = document.createElement("ceiling-fan-card");
        card.setConfig({ type: "custom:ceiling-fan-card", ...config });
        wrap.append(card);
        grid.append(wrap);
        return card;
      });

      const setHass = (hass) => cards.forEach((c) => (c.hass = hass));
      setHass(createMockHass(initialStates, setHass, log));
      window.__cards = cards;

      document.getElementById("theme").addEventListener("click", () => {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
      });
    </script>
  </body>
</html>
